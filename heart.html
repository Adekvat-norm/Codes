<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Слово из искр</title>

<style>
*{
    margin:0;    
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    display: flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    min-height:100dvh;
    background:radial-gradient(circle at center, #1f1f1f,#000);
    overflow:hidden;
    font-family: 'Arial Black', 'Impact', 'Helvetica Neue', sans-serif;
}

.container{
    position:relative;
    width:100%;
    max-width:800px;
    height:auto;
    aspect-ratio: 800 / 400;
    display: flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.word-container{
    position:relative;
    width:100%;
    height:100%;
}

.spark-particle{
    position:absolute;
    width:clamp(3px, 1.2vw, 5px);
    height:clamp(3px, 1.2vw, 5px);
    border-radius:50%;
    background:#ff3366;
    box-shadow:0 0 12px #fff, 0 0 20px #ff3366, 0 0 30px #ff6699;
    pointer-events:none;
    opacity:0;
    z-index:20;
}

.spark-burst{
    position:absolute;
    width:clamp(3px, 1vw, 4px);
    height:clamp(3px, 1vw, 4px);
    border-radius:50%;
    background:#ff6699;
    box-shadow:0 0 10px #fff, 0 0 15px #ff3366;
    pointer-events:none;
    opacity:0;
    z-index:20;
}

@keyframes sparkFromCenter{
    0%{
        transform:translate(var(--centerX), var(--centerY)) scale(1.2);
        opacity:1;
    }
    100%{
        transform:translate(var(--targetX), var(--targetY)) scale(0);
        opacity:0;
    }
}

@keyframes burstOut{
    0%{
        transform:translate(var(--x), var(--y)) scale(0);
        opacity:1;
    }
    100%{
        transform:translate(var(--targetX), var(--targetY)) scale(1.5);
        opacity:0;
    }
}

@keyframes finalGlow{
    0%,100%{
        text-shadow:0 0 20px #ff3366, 0 0 40px #ff6699;
        opacity:1;
    }
    50%{
        text-shadow:0 0 50px #ff6699, 0 0 80px #ff3366;
        opacity:1;
    }
}

.word-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:clamp(32px, 8vw, 80px);
    font-weight:900;
    color:#ff3366;
    text-shadow:0 0 30px #ff3366;
    letter-spacing:clamp(4px, 2vw, 15px);
    opacity:0;
    white-space:nowrap;
    z-index:10;
    user-select: none;
    -webkit-user-select: none;
}

/* Специальные настройки для маленьких экранов */
@media (max-width: 600px) {
    .word-text {
        font-size: 38px;
        letter-spacing: 6px;
    }
}

@media (max-width: 480px) {
    .word-text {
        font-size: 30px;
        letter-spacing: 4px;
    }
}

@media (max-width: 380px) {
    .word-text {
        font-size: 26px;
        letter-spacing: 3px;
    }
}

/* Адаптация для планшетов */
@media (min-width: 601px) and (max-width: 1024px) {
    .word-text {
        font-size: 70px;
        letter-spacing: 12px;
    }
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: opacity 1s ease;
}

.loading-text {
    color: #ff3366;
    font-size: 20px;
    font-family: monospace;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-text">✨ ЗАГРУЗКА... ✨</div>
</div>

<div class="container">
    <div class="word-container">
        <div class="word-text" id="wordText">ПОШЁЛ НАХУЙ</div>
    </div>
</div>

<script>
// Скрываем загрузочный экран через 0.5 секунды
setTimeout(() => {
    const overlay = document.getElementById('loadingOverlay');
    if(overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 1000);
    }
}, 500);

const container = document.querySelector('.container');
const wordText = document.getElementById('wordText');

function getResponsiveCenter() {
    const containerRect = container.querySelector('.word-container').getBoundingClientRect();
    return {
        x: containerRect.left + containerRect.width / 2,
        y: containerRect.top + containerRect.height / 2
    };
}

function createSparkToPoint(targetX, targetY, delay, centerX, centerY) {
    setTimeout(() => {
        const spark = document.createElement('div');
        spark.className = 'spark-particle';
        
        spark.style.setProperty('--targetX', `${targetX}px`);
        spark.style.setProperty('--targetY', `${targetY}px`);
        spark.style.setProperty('--centerX', `${centerX}px`);
        spark.style.setProperty('--centerY', `${centerY}px`);
        
        spark.style.left = '0px';
        spark.style.top = '0px';
        spark.style.transform = `translate(${centerX}px, ${centerY}px)`;
        
        const duration = 0.4 + Math.random() * 0.3;
        spark.style.animation = `sparkFromCenter ${duration}s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards`;
        
        container.appendChild(spark);
        setTimeout(() => spark.remove(), duration * 1000);
    }, delay);
}

function createBurstSpark(centerX, centerY, delay) {
    setTimeout(() => {
        const spark = document.createElement('div');
        spark.className = 'spark-burst';
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 150;
        const targetX = centerX + Math.cos(angle) * distance;
        const targetY = centerY + Math.sin(angle) * distance;
        
        spark.style.setProperty('--targetX', `${targetX}px`);
        spark.style.setProperty('--targetY', `${targetY}px`);
        spark.style.setProperty('--x', `${centerX}px`);
        spark.style.setProperty('--y', `${centerY}px`);
        
        spark.style.left = `${centerX}px`;
        spark.style.top = `${centerY}px`;
        
        const duration = 0.5 + Math.random() * 0.4;
        spark.style.animation = `burstOut ${duration}s ease-out forwards`;
        
        container.appendChild(spark);
        setTimeout(() => spark.remove(), duration * 1000);
    }, delay);
}

function startAnimation() {
    const center = getResponsiveCenter();
    const centerX = center.x;
    const centerY = center.y;
    
    const containerRect = container.querySelector('.word-container').getBoundingClientRect();
    const scale = Math.min(containerRect.width / 800, 0.7);
    
    const baseX = centerX - (160 * scale);
    const letterSpacing = 110 * scale;
    
    const allPoints = [];
    
    // Буквы: П, О, Ш, Ё, Л (пропускаем пробел), Н, А, Х, У, Й
    // Упрощённое создание точек для фразы "ПОШЁЛ НАХУЙ"
    
    // П
    for(let i = 0; i < 60; i++) {
        const offsetX = 0;
        if(i < 25) {
            allPoints.push({ x: baseX + offsetX + (20 + Math.random() * 50) * scale, y: centerY - (60 + Math.random() * 70) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (35 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 60) * scale });
        }
    }
    
    // О
    for(let i = 0; i < 60; i++) {
        const offsetX = letterSpacing;
        const angle = Math.random() * Math.PI * 2;
        const radius = 30 + Math.random() * 15;
        allPoints.push({
            x: baseX + offsetX + 40 * scale + Math.cos(angle) * radius * scale,
            y: centerY - 30 * scale + Math.sin(angle) * radius * scale
        });
    }
    
    // Ш
    for(let i = 0; i < 70; i++) {
        const offsetX = letterSpacing * 2;
        const stick = Math.floor(Math.random() * 3);
        allPoints.push({
            x: baseX + offsetX + (25 + stick * 25 + Math.random() * 15) * scale,
            y: centerY - (60 + Math.random() * 70) * scale
        });
    }
    
    // Ё
    for(let i = 0; i < 55; i++) {
        const offsetX = letterSpacing * 3;
        if(i < 40) {
            allPoints.push({ x: baseX + offsetX + (35 + Math.random() * 20) * scale, y: centerY - (50 + Math.random() * 60) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (45 + Math.random() * 10) * scale, y: centerY - (80 + Math.random() * 15) * scale });
        }
    }
    
    // Л
    for(let i = 0; i < 55; i++) {
        const offsetX = letterSpacing * 4;
        allPoints.push({ x: baseX + offsetX + (25 + Math.random() * 40) * scale, y: centerY - (50 + Math.random() * 70) * scale });
    }
    
    // Пробел - пропускаем
    
    // Н
    for(let i = 0; i < 60; i++) {
        const offsetX = letterSpacing * 5.5;
        if(i < 30) {
            allPoints.push({ x: baseX + offsetX + (25 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 70) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (65 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 70) * scale });
        }
    }
    
    // А
    for(let i = 0; i < 60; i++) {
        const offsetX = letterSpacing * 6.5;
        if(i < 30) {
            allPoints.push({ x: baseX + offsetX + (25 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 70) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (40 + Math.random() * 15) * scale, y: centerY - (20 + Math.random() * 20) * scale });
        }
    }
    
    // Х
    for(let i = 0; i < 60; i++) {
        const offsetX = letterSpacing * 7.5;
        if(i < 30) {
            allPoints.push({ x: baseX + offsetX + (25 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 70) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (65 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 70) * scale });
        }
    }
    
    // У
    for(let i = 0; i < 55; i++) {
        const offsetX = letterSpacing * 8.5;
        if(i < 30) {
            allPoints.push({ x: baseX + offsetX + (25 + Math.random() * 15) * scale, y: centerY - (50 + Math.random() * 60) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (30 + Math.random() * 40) * scale, y: centerY - (15 + Math.random() * 25) * scale });
        }
    }
    
    // Й
    for(let i = 0; i < 55; i++) {
        const offsetX = letterSpacing * 9.5;
        if(i < 45) {
            allPoints.push({ x: baseX + offsetX + (35 + Math.random() * 20) * scale, y: centerY - (50 + Math.random() * 60) * scale });
        } else {
            allPoints.push({ x: baseX + offsetX + (45 + Math.random() * 10) * scale, y: centerY - (80 + Math.random() * 15) * scale });
        }
    }
    
    // Перемешиваем точки
    for(let i = allPoints.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPoints[i], allPoints[j]] = [allPoints[j], allPoints[i]];
    }
    
    // Запускаем искры
    allPoints.forEach((point, index) => {
        const delay = 1500 + index * 10;
        createSparkToPoint(point.x, point.y, delay, centerX, centerY);
    });
    
    const totalDelay = 1500 + allPoints.length * 10 + 300;
    setTimeout(() => {
        wordText.style.animation = 'finalGlow 0.8s ease-out forwards';
        wordText.style.opacity = '1';
        
        for(let i = 0; i < 80; i++) {
            createBurstSpark(centerX, centerY, i * 12);
        }
        
        setTimeout(() => {
            for(let i = 0; i < 50; i++) {
                const randomPoint = allPoints[Math.floor(Math.random() * allPoints.length)];
                createBurstSpark(randomPoint.x, randomPoint.y, i * 20);
            }
        }, 500);
        
        let pulseCount = 0;
        const pulseInterval = setInterval(() => {
            if(pulseCount >= 6) clearInterval(pulseInterval);
            wordText.style.transform = 'translate(-50%, -50%) scale(' + (1 + Math.sin(pulseCount * 1.5) * 0.05) + ')';
            pulseCount++;
        }, 200);
        
    }, totalDelay);
}

window.addEventListener('load', () => {
    setTimeout(() => startAnimation(), 100);
});

let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        const sparks = document.querySelectorAll('.spark-particle, .spark-burst');
        sparks.forEach(spark => spark.remove());
        wordText.style.opacity = '0';
        wordText.style.animation = 'none';
        setTimeout(() => startAnimation(), 100);
    }, 250);
});
</script>

</body>
</html>
