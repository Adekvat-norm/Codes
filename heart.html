<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Слово из искр - ТУТ</title>

<style>
*{
    margin:0;    
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

body{
    display: flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    min-height:100dvh; /* Для мобильных браузеров */
    background:radial-gradient(circle at center, #1f1f1f,#000);
    overflow:hidden;
    font-family: 'Arial Black', 'Impact', 'Helvetica Neue', sans-serif;
    touch-action: pan-x pan-y; /* Улучшает сенсорное управление */
}

.container{
    position:relative;
    width:100%;
    max-width:800px;
    height:auto;
    aspect-ratio: 800 / 400;
    display: flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.word-container{
    position:relative;
    width:100%;
    height:100%;
}

.spark-particle{
    position:absolute;
    width:clamp(4px, 1.5vw, 6px);
    height:clamp(4px, 1.5vw, 6px);
    border-radius:50%;
    background:#ff3366;
    box-shadow:0 0 12px #fff, 0 0 20px #ff3366, 0 0 30px #ff6699;
    pointer-events:none;
    opacity:0;
    z-index:20;
}

.spark-burst{
    position:absolute;
    width:clamp(3px, 1.2vw, 5px);
    height:clamp(3px, 1.2vw, 5px);
    border-radius:50%;
    background:#ff6699;
    box-shadow:0 0 10px #fff, 0 0 15px #ff3366;
    pointer-events:none;
    opacity:0;
    z-index:20;
}

@keyframes sparkFromCenter{
    0%{
        transform:translate(var(--centerX), var(--centerY)) scale(1.2);
        opacity:1;
    }
    100%{
        transform:translate(var(--targetX), var(--targetY)) scale(0);
        opacity:0;
    }
}

@keyframes burstOut{
    0%{
        transform:translate(var(--x), var(--y)) scale(0);
        opacity:1;
    }
    100%{
        transform:translate(var(--targetX), var(--targetY)) scale(1.5);
        opacity:0;
    }
}

@keyframes finalGlow{
    0%,100%{
        text-shadow:0 0 20px #ff3366, 0 0 40px #ff6699;
        opacity:1;
    }
    50%{
        text-shadow:0 0 50px #ff6699, 0 0 80px #ff3366;
        opacity:1;
    }
}

.word-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:clamp(60px, 20vw, 180px);
    font-weight:900;
    color:#ff3366;
    text-shadow:0 0 30px #ff3366;
    letter-spacing:clamp(10px, 4vw, 30px);
    opacity:0;
    white-space:nowrap;
    z-index:10;
    user-select: none; /* Запрет выделения текста */
    -webkit-user-select: none;
}

/* Медиа-запрос для очень маленьких экранов */
@media (max-width: 600px) {
    .word-text {
        letter-spacing: 15px;
        font-size: 70px;
    }
}

@media (max-width: 480px) {
    .word-text {
        letter-spacing: 8px;
        font-size: 55px;
    }
}

/* Адаптация для планшетов */
@media (min-width: 601px) and (max-width: 1024px) {
    .word-text {
        font-size: 100px;
        letter-spacing: 22px;
    }
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: opacity 1s ease;
}

.loading-text {
    color: #ff3366;
    font-size: 15px;
    font-family: monospace;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-text">✨ ЗАГРУЗКА... ✨</div>
</div>

<div class="container">
    <div class="word-container">
        <div class="word-text" id="wordText">ПОШЁЛ НАХУЙ</div>
    </div>
</div>

<script>
// Скрываем загрузочный экран через 0.5 секунды
setTimeout(() => {
    const overlay = document.getElementById('loadingOverlay');
    if(overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 1000);
    }
}, 500);

const container = document.querySelector('.container');
const wordText = document.getElementById('wordText');

// Получаем актуальные размеры и позиции для мобильных устройств
function getResponsiveCenter() {
    const rect = container.getBoundingClientRect();
    const containerRect = container.querySelector('.word-container').getBoundingClientRect();
    return {
        x: containerRect.left + containerRect.width / 2,
        y: containerRect.top + containerRect.height / 2
    };
}

// Создаём искру, летящую из центра к точке (адаптивная версия)
function createSparkToPoint(targetX, targetY, delay, centerX, centerY) {
    setTimeout(() => {
        const spark = document.createElement('div');
        spark.className = 'spark-particle';
        
        spark.style.setProperty('--targetX', `${targetX}px`);
        spark.style.setProperty('--targetY', `${targetY}px`);
        spark.style.setProperty('--centerX', `${centerX}px`);
        spark.style.setProperty('--centerY', `${centerY}px`);
        
        spark.style.left = '0px';
        spark.style.top = '0px';
        
        // Используем вычисленный центр
        const computedStyle = `translate(${centerX}px, ${centerY}px)`;
        spark.style.transform = computedStyle;
        
        const duration = 0.4 + Math.random() * 0.3;
        spark.style.animation = `sparkFromCenter ${duration}s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards`;
        
        container.appendChild(spark);
        
        setTimeout(() => spark.remove(), duration * 1000);
    }, delay);
}

// Финальный взрыв искр (адаптивная версия)
function createBurstSpark(centerX, centerY, delay) {
    setTimeout(() => {
        const spark = document.createElement('div');
        spark.className = 'spark-burst';
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 200;
        const targetX = centerX + Math.cos(angle) * distance;
        const targetY = centerY + Math.sin(angle) * distance;
        
        spark.style.setProperty('--targetX', `${targetX}px`);
        spark.style.setProperty('--targetY', `${targetY}px`);
        spark.style.setProperty('--x', `${centerX}px`);
        spark.style.setProperty('--y', `${centerY}px`);
        
        spark.style.left = `${centerX}px`;
        spark.style.top = `${centerY}px`;
        
        const duration = 0.5 + Math.random() * 0.4;
        spark.style.animation = `burstOut ${duration}s ease-out forwards`;
        
        container.appendChild(spark);
        
        setTimeout(() => spark.remove(), duration * 1000);
    }, delay);
}

// Основная анимация с адаптивными координатами
function startAnimation() {
    const center = getResponsiveCenter();
    const centerX = center.x;
    const centerY = center.y;
    
    // Получаем размеры для масштабирования букв
    const containerRect = container.querySelector('.word-container').getBoundingClientRect();
    const scale = Math.min(containerRect.width / 800, 1);
    
    // Базовая позиция для букв (адаптивная)
    const baseX = centerX - (180 * scale);
    const letterSpacing = 140 * scale;
    
    const allPoints = [];
    
    // Буква Т (первая)
    for(let i = 0; i < 90; i++) {
        if(i < 40) {
            // горизонтальная палка
            allPoints.push({
                x: baseX + (20 + Math.random() * 80) * scale,
                y: centerY - (70 + Math.random() * 15) * scale
            });
        } else {
            // вертикальная палка
            allPoints.push({
                x: baseX + (55 + Math.random() * 15) * scale,
                y: centerY - (60 + Math.random() * 90) * scale
            });
        }
    }
    
    // Буква У
    for(let i = 0; i < 100; i++) {
        const offsetX = letterSpacing;
        if(i < 35) {
            // левая палка
            allPoints.push({
                x: baseX + offsetX + (25 + Math.random() * 15) * scale,
                y: centerY - (60 + Math.random() * 70) * scale
            });
        } else if(i < 70) {
            // правая палка
            allPoints.push({
                x: baseX + offsetX + (85 + Math.random() * 15) * scale,
                y: centerY - (60 + Math.random() * 70) * scale
            });
        } else {
            // низ У
            allPoints.push({
                x: baseX + offsetX + (30 + Math.random() * 65) * scale,
                y: centerY - (10 + Math.random() * 25) * scale
            });
        }
    }
    
    // Буква Т (вторая)
    for(let i = 0; i < 90; i++) {
        const offsetX = letterSpacing * 2;
        if(i < 40) {
            // горизонтальная палка
            allPoints.push({
                x: baseX + offsetX + (20 + Math.random() * 80) * scale,
                y: centerY - (70 + Math.random() * 15) * scale
            });
        } else {
            // вертикальная палка
            allPoints.push({
                x: baseX + offsetX + (55 + Math.random() * 15) * scale,
                y: centerY - (60 + Math.random() * 90) * scale
            });
        }
    }
    
    // Перемешиваем точки
    for(let i = allPoints.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPoints[i], allPoints[j]] = [allPoints[j], allPoints[i]];
    }
    
    // Запускаем искры
    allPoints.forEach((point, index) => {
        const delay = 1500 + index * 12;
        createSparkToPoint(point.x, point.y, delay, centerX, centerY);
    });
    
    // Появление текста
    const totalDelay = 1500 + allPoints.length * 12 + 300;
    setTimeout(() => {
        wordText.style.animation = 'finalGlow 0.8s ease-out forwards';
        wordText.style.opacity = '1';
        
        // Финальный взрыв
        for(let i = 0; i < 100; i++) {
            createBurstSpark(centerX, centerY, i * 15);
        }
        
        // Дополнительные искры
        setTimeout(() => {
            for(let i = 0; i < 60; i++) {
                const randomPoint = allPoints[Math.floor(Math.random() * allPoints.length)];
                createBurstSpark(randomPoint.x, randomPoint.y, i * 20);
            }
        }, 500);
        
        // Пульсация
        let pulseCount = 0;
        const pulseInterval = setInterval(() => {
            if(pulseCount >= 6) clearInterval(pulseInterval);
            wordText.style.transform = 'translate(-50%, -50%) scale(' + (1 + Math.sin(pulseCount * 1.5) * 0.05) + ')';
            pulseCount++;
        }, 200);
        
    }, totalDelay);
}

// Запускаем анимацию после загрузки страницы
window.addEventListener('load', () => {
    setTimeout(() => {
        startAnimation();
    }, 100);
});

// Перезапускаем анимацию при изменении ориентации экрана (опционально)
let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
        // Очищаем старые искры
        const sparks = document.querySelectorAll('.spark-particle, .spark-burst');
        sparks.forEach(spark => spark.remove());
        
        // Перезапускаем анимацию
        wordText.style.opacity = '0';
        wordText.style.animation = 'none';
        setTimeout(() => startAnimation(), 100);
    }, 250);
});
</script>

</body>
</html>
