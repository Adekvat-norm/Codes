<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слово из искр - ТУТ</title>

<style>
*{
    margin:0;    
    padding:0;
    box-sizing:border-box;
}

body{
    display: flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:radial-gradient(circle at center, #1f1f1f,#000);
    overflow:hidden;
    font-family: 'Arial Black', 'Impact', sans-serif;
}

.container{
    position:relative;
    width:800px;
    height:400px;
    display: flex;
    justify-content:center;
    align-items:center;
}

.word-container{
    position:relative;
    width:100%;
    height:100%;
}

.spark-particle{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ff3366;
    box-shadow:0 0 12px #fff, 0 0 20px #ff3366, 0 0 30px #ff6699;
    pointer-events:none;
    opacity:0;
    z-index:20;
}

.spark-burst{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ff6699;
    box-shadow:0 0 10px #fff, 0 0 15px #ff3366;
    pointer-events:none;
    opacity:0;
    z-index:20;
}

@keyframes sparkFromCenter{
    0%{
        transform:translate(400px, 200px) scale(1.2);
        opacity:1;
    }
    100%{
        transform:translate(var(--targetX), var(--targetY)) scale(0);
        opacity:0;
    }
}

@keyframes burstOut{
    0%{
        transform:translate(var(--x), var(--y)) scale(0);
        opacity:1;
    }
    100%{
        transform:translate(var(--targetX), var(--targetY)) scale(1.5);
        opacity:0;
    }
}

@keyframes finalGlow{
    0%,100%{
        text-shadow:0 0 20px #ff3366, 0 0 40px #ff6699;
        opacity:1;
    }
    50%{
        text-shadow:0 0 50px #ff6699, 0 0 80px #ff3366;
        opacity:1;
    }
}

.word-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:180px;
    font-weight:900;
    color:#ff3366;
    text-shadow:0 0 30px #ff3366;
    letter-spacing:30px;
    opacity:0;
    white-space:nowrap;
    z-index:10;
}

/* Тени для букв для отлова позиций искр (невидимые) */
.letter-mask{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:180px;
    font-weight:900;
    color:transparent;
    white-space:nowrap;
    letter-spacing:30px;
    z-index:5;
    pointer-events:none;
}
</style>
</head>
<body>
<div class="container">
    <div class="word-container">
        <div class="word-text" id="wordText">ПШЛ НАХУЙ</div>
        
        <!-- Невидимые маски для каждой буквы -->
        <div class="letter-mask" id="maskT1">П</div>
        <div class="letter-mask" id="maskT1">О</div>
        <div class="letter-mask" id="maskY">Ш</div>
        <div class="letter-mask" id="maskT1">Ё</div>
        <div class="letter-mask" id="maskT2">Л</div>
        <div class="letter-mask" id="maskT2">Н</div>
        <div class="letter-mask" id="maskT2">А</div>
        <div class="letter-mask" id="maskT2">Х</div>
        <div class="letter-mask" id="maskT2">У</div>
        <div class="letter-mask" id="maskT2">Й</div>
    </div>
</div>

<script>
const container = document.querySelector('.container');
const wordText = document.getElementById('wordText');

// Функция для получения позиции случайной точки внутри буквы (приблизительно)
function getLetterPoints(letter, centerX, centerY) {
    const points = [];
    const baseX = centerX - 180;
    const letterWidth = 120;
    
    let offsetX = 0;
    if(letter === 'Т') {
        // Первая Т
        offsetX = 0;
        // Горизонтальная палка Т
        for(let i = 0; i < 40; i++) {
            points.push({
                x: baseX + offsetX + 20 + Math.random() * 80,
                y: centerY - 70 + Math.random() * 20
            });
        }
        // Вертикальная палка Т
        for(let i = 0; i < 50; i++) {
            points.push({
                x: baseX + offsetX + 55 + Math.random() * 20,
                y: centerY - 60 + Math.random() * 100
            });
        }
    } else if(letter === 'У') {
        offsetX = 140;
        // Левая палка У
        for(let i = 0; i < 30; i++) {
            points.push({
                x: baseX + offsetX + 25 + Math.random() * 20,
                y: centerY - 60 + Math.random() * 80
            });
        }
        // Правая палка У
        for(let i = 0; i < 30; i++) {
            points.push({
                x: baseX + offsetX + 85 + Math.random() * 20,
                y: centerY - 60 + Math.random() * 80
            });
        }
        // Низ У (дуга)
        for(let i = 0; i < 40; i++) {
            points.push({
                x: baseX + offsetX + 30 + Math.random() * 70,
                y: centerY - 10 + Math.random() * 30
            });
        }
    }
    
    return points;
}

// Создаём искру, летящую из центра к точке
function createSparkToPoint(targetX, targetY, delay) {
    setTimeout(() => {
        const spark = document.createElement('div');
        spark.className = 'spark-particle';
        
        const centerX = 400;
        const centerY = 200;
        
        spark.style.setProperty('--targetX', `${targetX}px`);
        spark.style.setProperty('--targetY', `${targetY}px`);
        
        spark.style.left = '0px';
        spark.style.top = '0px';
        spark.style.transform = `translate(${centerX}px, ${centerY}px)`;
        
        const duration = 0.4 + Math.random() * 0.3;
        spark.style.animation = `sparkFromCenter ${duration}s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards`;
        
        container.appendChild(spark);
        
        setTimeout(() => spark.remove(), duration * 1000);
    }, delay);
}

// Финальный взрыв искр
function createBurstSpark(centerX, centerY, delay) {
    setTimeout(() => {
        const spark = document.createElement('div');
        spark.className = 'spark-burst';
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 80 + Math.random() * 200;
        const targetX = centerX + Math.cos(angle) * distance;
        const targetY = centerY + Math.sin(angle) * distance;
        
        spark.style.setProperty('--targetX', `${targetX}px`);
        spark.style.setProperty('--targetY', `${targetY}px`);
        spark.style.setProperty('--x', `${centerX}px`);
        spark.style.setProperty('--y', `${centerY}px`);
        
        spark.style.left = `${centerX}px`;
        spark.style.top = `${centerY}px`;
        
        const duration = 0.5 + Math.random() * 0.4;
        spark.style.animation = `burstOut ${duration}s ease-out forwards`;
        
        container.appendChild(spark);
        
        setTimeout(() => spark.remove(), duration * 1000);
    }, delay);
}

// Получаем позиции букв
const rect = container.getBoundingClientRect();
const centerX = 400;
const centerY = 200;

// Собираем все точки для букв
const allPoints = [];

// Точки для буквы Т (первая)
for(let i = 0; i < 90; i++) {
    if(i < 40) {
        // горизонтальная палка
        allPoints.push({
            x: centerX - 180 + 20 + Math.random() * 80,
            y: centerY - 70 + Math.random() * 15
        });
    } else {
        // вертикальная палка
        allPoints.push({
            x: centerX - 180 + 55 + Math.random() * 15,
            y: centerY - 60 + Math.random() * 90
        });
    }
}

// Точки для буквы У
for(let i = 0; i < 100; i++) {
    const offsetX = 140;
    if(i < 35) {
        // левая палка
        allPoints.push({
            x: centerX - 180 + offsetX + 25 + Math.random() * 15,
            y: centerY - 60 + Math.random() * 70
        });
    } else if(i < 70) {
        // правая палка
        allPoints.push({
            x: centerX - 180 + offsetX + 85 + Math.random() * 15,
            y: centerY - 60 + Math.random() * 70
        });
    } else {
        // низ У
        allPoints.push({
            x: centerX - 180 + offsetX + 30 + Math.random() * 65,
            y: centerY - 10 + Math.random() * 25
        });
    }
}

// Точки для буквы Т (вторая)
for(let i = 0; i < 90; i++) {
    const offsetX = 280;
    if(i < 40) {
        // горизонтальная палка
        allPoints.push({
            x: centerX - 180 + offsetX + 20 + Math.random() * 80,
            y: centerY - 70 + Math.random() * 15
        });
    } else {
        // вертикальная палка
        allPoints.push({
            x: centerX - 180 + offsetX + 55 + Math.random() * 15,
            y: centerY - 60 + Math.random() * 90
        });
    }
}

// Перемешиваем точки для более естественного заполнения
for(let i = allPoints.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allPoints[i], allPoints[j]] = [allPoints[j], allPoints[i]];
}

// Запускаем искры к точкам букв
allPoints.forEach((point, index) => {
    const delay = 1500 + index * 12;
    createSparkToPoint(point.x, point.y, delay);
});

// Появление текста после сбора всех искр
const totalDelay = 1500 + allPoints.length * 12 + 300;
setTimeout(() => {
    wordText.style.animation = 'finalGlow 0.8s ease-out forwards';
    wordText.style.opacity = '1';
    
    // Финальный взрыв искр из центра
    for(let i = 0; i < 100; i++) {
        createBurstSpark(400, 200, i * 15);
    }
    
    // Дополнительные искры из букв
    setTimeout(() => {
        for(let i = 0; i < 60; i++) {
            const randomPoint = allPoints[Math.floor(Math.random() * allPoints.length)];
            createBurstSpark(randomPoint.x, randomPoint.y, i * 20);
        }
    }, 500);
    
    // Пульсация слова
    let pulseCount = 0;
    const pulseInterval = setInterval(() => {
        if(pulseCount >= 6) clearInterval(pulseInterval);
        wordText.style.transform = 'translate(-50%, -50%) scale(' + (1 + Math.sin(pulseCount * 1.5) * 0.05) + ')';
        pulseCount++;
    }, 200);
    
}, totalDelay);

// Запасной таймер на случай ошибки
setTimeout(() => {
    if(wordText.style.opacity === '0' || wordText.style.opacity === '') {
        wordText.style.opacity = '1';
        wordText.style.textShadow = '0 0 40px #ff3366';
    }
}, 8000);
</script>

</body>
</html>
